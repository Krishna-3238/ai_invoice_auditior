services:
  postgres:
    container_name: postgres
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mock-erp:
    container_name: mock_erp
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "mock_erp.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      REDIS_URL: redis://redis:6379/0
      ERP_CACHE_TTL_SECONDS: ${ERP_CACHE_TTL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  extractor-agent:
    container_name: extractor_agent
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "agents.adk_agents.service:app", "--host", "0.0.0.0", "--port", "8101"]
    environment:
      AGENT_TYPE: extractor
      LOG_FILE: extractor-agent.log
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-false}
      MCP_SERVER_URL: http://mcp:8100/mcp
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    expose: ["8101"]
    volumes:
      - ./data/incoming:/app/data/incoming
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  translator-agent:
    container_name: translator_agent
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "agents.adk_agents.service:app", "--host", "0.0.0.0", "--port", "8102"]
    environment:
      AGENT_TYPE: translator
      LOG_FILE: translator-agent.log
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-false}
      MCP_SERVER_URL: http://mcp:8100/mcp
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    expose: ["8102"]
    volumes:
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8102/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  reporter-agent:
    container_name: reporter_agent
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "agents.adk_agents.service:app", "--host", "0.0.0.0", "--port", "8103"]
    environment:
      AGENT_TYPE: reporter
      LOG_FILE: reporter-agent.log
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-false}
      MCP_SERVER_URL: http://mcp:8100/mcp
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    expose: ["8103"]
    volumes:
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8103/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "protocols.mcp_gateway:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      LOG_FILE: mcp-gateway.log
      A2A_EXTRACTOR_URL: http://extractor-agent:8101
      A2A_TRANSLATOR_URL: http://translator-agent:8102
      A2A_REPORTER_URL: http://reporter-agent:8103
    depends_on:
      extractor-agent:
        condition: service_healthy
      translator-agent:
        condition: service_healthy
      reporter-agent:
        condition: service_healthy
    ports: ["8100:8100"]
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agents:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "agents/langgraph_agents/monitor_agent.py"]
    environment:
      LOG_FILE: monitor-agent.log
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-false}
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: invoice_chunks
      REDIS_URL: redis://redis:6379/0
      ERP_API_URL: http://mock-erp:8000
      A2A_EXTRACTOR_URL: http://extractor-agent:8101
      A2A_TRANSLATOR_URL: http://translator-agent:8102
      A2A_REPORTER_URL: http://reporter-agent:8103
      MCP_SERVER_URL: http://mcp:8100/mcp
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_POLL_SECONDS: ${IMAP_POLL_SECONDS:-60}
    depends_on:
      mock-erp:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      extractor-agent:
        condition: service_healthy
      translator-agent:
        condition: service_healthy
      reporter-agent:
        condition: service_healthy
      mcp:
        condition: service_healthy
    volumes:
      - ./data/incoming:/app/data/incoming
      - ./data/vector_db:/app/data/vector_db
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    restart: unless-stopped

  ui:
    container_name: streamlit_app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      LOG_FILE: streamlit-ui.log
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-false}
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: invoice_chunks
      REDIS_URL: redis://redis:6379/0
      ERP_API_URL: http://mock-erp:8000
      A2A_EXTRACTOR_URL: http://extractor-agent:8101
      A2A_TRANSLATOR_URL: http://translator-agent:8102
      A2A_REPORTER_URL: http://reporter-agent:8103
      MCP_SERVER_URL: http://mcp:8100/mcp
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      mock-erp:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      extractor-agent:
        condition: service_healthy
      translator-agent:
        condition: service_healthy
      reporter-agent:
        condition: service_healthy
      mcp:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./data/incoming:/app/data/incoming
      - ./data/vector_db:/app/data/vector_db
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
