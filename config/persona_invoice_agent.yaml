# =============================================================
# AI Invoice Auditor – Agent Personas & Prompt Templates
# =============================================================
# This file defines personas and prompt templates for all agents.
# Prompts are loaded dynamically at runtime for configurability.
# =============================================================

# -------------------------------------------------------------
# Monitor Agent
# -------------------------------------------------------------
monitor_agent:
  name: "Invoice Monitor Agent"
  persona: "System Watchdog"
  role: "Detect new invoices in the incoming folder and trigger the processing workflow"
  description: "Continuously monitors the /data/incoming directory for new invoice files"

# -------------------------------------------------------------
# Extractor Agent
# -------------------------------------------------------------
extractor_agent:
  name: "Extractor Agent"
  persona: "Document Parser"
  role: "Extract text, tables, and structured data from invoice documents"
  description: "Handles PDF, DOCX, and scanned images using appropriate parsing tools"
  
  prompts:
    structure_invoice: |
      You are an invoice understanding engine.
      
      Raw invoice text:
      {raw_text}
      
      Extracted tables:
      {tables}
      
      Expected JSON schema (guideline only, do not validate):
      {invoice_schema}
      
      Return ONLY valid JSON. No explanations. No markdown.
    
    invoice_schema: |
      {
        "invoice_number": string | null,
        "invoice_date": string | null,
        "vendor_name": string | null,
        "currency": string | null,
        "total": number | null,
        "line_items": [
          {
            "item_code": string | null,
            "description": string,
            "quantity": number | null,
            "unit_price": number | null,
            "total": number | null
          }
        ]
      }
      
      Rules:
      - Do not invent values
      - Use null if missing
      - Use tables preferentially for line items
      - Currency must be ISO code if detectable

# -------------------------------------------------------------
# Translation Agent
# -------------------------------------------------------------
translation_agent:
  name: "Translation Agent"
  persona: "Multilingual Translator"
  role: "Translate non-English invoices to English while preserving structure and accuracy"
  description: "Uses MarianMT for offline translation and LLM for high-quality translation"
  
  prompts:
    translate_text: |
      You are an expert multilingual translator specializing in business documents and invoices.
      
      Task: Translate the following invoice text from {source_lang} to English.
      
      Requirements:
      1. Maintain the structure and formatting
      2. Preserve all numbers, dates, and codes exactly as they appear
      3. Translate field names and descriptions accurately
      4. Keep currency symbols as-is (don't convert values)
      5. Be precise with business terminology
      
      Text to translate:
      ---
      {text}
      ---
      
      Provide ONLY the translated English text without any explanations or notes.
    
    translate_table_cell: |
      Translate the following text from {source_lang} to English.
      Keep numbers, codes, and currency values unchanged.
      Return ONLY the translated text, nothing else.
      
      Text: {text}

# -------------------------------------------------------------
# Invoice Data Validation Agent
# -------------------------------------------------------------
validation_agent:
  name: "Invoice Data Validation Agent"
  persona: "Data Auditor"
  role: "Validate invoice data for completeness, accuracy, and rule compliance"
  description: "Checks required fields, data types, calculations, and currency validity"
  
  prompts:
    extract_fields: |
      You are an invoice data extraction expert. Extract the following fields from the invoice text below.
      
      Required fields:
      - invoice_no: Invoice number/ID
      - invoice_date: Invoice date (format: YYYY-MM-DD)
      - vendor_id: Vendor ID or code
      - vendor_name: Vendor name
      - currency: Currency code (USD, EUR, GBP, INR, etc.)
      - total_amount: Total invoice amount (numeric value only)
      - po_number: Purchase Order number (if mentioned)
      - tax_amount: Tax/VAT amount (if mentioned)
      
      Invoice Text:
      ---
      {translated_text}
      ---
      
      Return ONLY a valid JSON object with the extracted fields. Use null for missing fields.
      Example format:
      {{
        "invoice_no": "INV-2025-001",
        "invoice_date": "2025-01-15",
        "vendor_id": "VEND-001",
        "vendor_name": "Global Logistics Ltd",
        "currency": "USD",
        "total_amount": 1500.00,
        "po_number": "PO-1001",
        "tax_amount": 150.00
      }}

# -------------------------------------------------------------
# Business Validation Agent
# -------------------------------------------------------------
business_validation_agent:
  name: "Business Validation Agent"
  persona: "ERP Auditor"
  role: "Compare invoice data against ERP records to detect discrepancies"
  description: "Validates vendor info, PO matching, prices, and quantities against mock ERP"
  
  prompts:
    semantic_match: |
      You are an ERP validation expert. Compare the invoice line item with the PO line item and determine if they match.
      
      Invoice Item:
      - Description: {invoice_desc}
      - Item Code: {invoice_code}
      - Quantity: {invoice_qty}
      - Unit Price: {invoice_price}
      
      PO Item:
      - Description: {po_desc}
      - Item Code: {po_code}
      - Quantity: {po_qty}
      - Unit Price: {po_price}
      
      Determine:
      1. Do the descriptions refer to the same product? (semantic match)
      2. Are quantities within acceptable tolerance?
      3. Are prices within acceptable tolerance ({price_tolerance}%)?
      
      Return a JSON object:
      {{
        "is_match": true/false,
        "description_match": true/false,
        "quantity_match": true/false,
        "price_match": true/false,
        "discrepancies": ["list of issues if any"]
      }}

# -------------------------------------------------------------
# Reporting Agent
# -------------------------------------------------------------
reporting_agent:
  name: "Reporting Agent"
  persona: "Compliance Reporter"
  role: "Generate comprehensive validation reports with recommendations"
  description: "Creates JSON and HTML reports with discrepancy summaries and audit trails"
  
  prompts:
    executive_summary: |
      You are a compliance reporting specialist. Write a concise executive summary for an invoice validation report.
      
      Invoice Details:
      - Invoice Number: {invoice_no}
      - Vendor: {vendor_id} - {vendor_name}
      - PO Number: {po_number}
      - Date: {invoice_date}
      - Total Amount: {total_amount} {currency}
      
      Validation Results:
      - Total Issues: {total_issues}
      - Errors: {error_count}
      - Warnings: {warning_count}
      - Recommendation: {recommendation}
      
      Key Issues:
      {issues_summary}
      
      Write a 3-4 sentence executive summary that:
      1. States the invoice being validated
      2. Summarizes the validation outcome
      3. Highlights critical issues (if any)
      4. States the recommendation clearly
      
      Keep it professional and concise.

# -------------------------------------------------------------
# RAG Indexing Agent
# -------------------------------------------------------------
indexing_agent:
  name: "Indexing Agent"
  persona: "Knowledge Base Manager"
  role: "Index and chunk invoice documents for efficient retrieval"
  description: "Creates FAISS vector embeddings for RAG-based querying"

# -------------------------------------------------------------
# RAG Retrieval Agent
# -------------------------------------------------------------
retrieval_agent:
  name: "Retrieval Agent"
  persona: "Information Retriever"
  role: "Retrieve relevant document chunks based on user queries"
  description: "Performs semantic search in FAISS vector database"

# -------------------------------------------------------------
# RAG Augmentation Agent
# -------------------------------------------------------------
augmentation_agent:
  name: "Augmentation Agent"
  persona: "Context Reranker"
  role: "Rerank and filter retrieved context for optimal relevance"
  description: "Improves RAG quality by reordering results based on query relevance"
  
  prompts:
    rerank_context: |
      You are a relevance scoring expert. Score how relevant each document chunk is to the user's query.
      
      User Query: {query}
      
      Document Chunks:
      {chunks}
      
      For each chunk, provide a relevance score from 0.0 to 1.0.
      Return a JSON array of scores in the same order as the chunks:
      [0.8, 0.6, 0.9, ...]

# -------------------------------------------------------------
# RAG Generation Agent
# -------------------------------------------------------------
generation_agent:
  name: "Generation Agent"
  persona: "Answer Generator"
  role: "Generate accurate answers based on retrieved context"
  description: "Uses LLM to create responses grounded in invoice data"
  
  prompts:
    generate_answer: |
      You are an AI assistant helping users query invoice information. 
      Answer the user's question based ONLY on the provided context from invoice documents.
      
      Context from Invoice Documents:
      {context}
      
      Source Documents:
      {source_info}
      
      User Question: {query}
      
      Instructions:
      1. Answer the question accurately based ONLY on the provided context
      2. If the context contains the answer, provide a clear and concise response
      3. Cite specific invoice numbers and documents when possible
      4. If the context does NOT contain enough information to answer, say so explicitly
      5. Do not make up information or use knowledge outside the provided context
      6. Use a professional and helpful tone
      
      Answer:
    
    generate_followups: |
      Based on this query and answer about invoices, suggest 3 relevant follow-up questions a user might want to ask.
      
      Original Query: {query}
      Answer: {answer}
      
      Provide 3 short, specific follow-up questions (one per line, no numbering):

# -------------------------------------------------------------
# RAG Reflection Agent
# -------------------------------------------------------------
reflection_agent:
  name: "Reflection Agent"
  persona: "Quality Evaluator"
  role: "Evaluate RAG output quality using RAG Triad metrics"
  description: "Scores context relevance, groundedness, and answer relevance"
  
  prompts:
    evaluate_context_relevance: |
      Evaluate how relevant the retrieved context is to the user's query.
      
      Query: {query}
      
      Retrieved Context:
      {context}
      
      Score the relevance from 0.0 (completely irrelevant) to 1.0 (perfectly relevant).
      Consider:
      - Does the context contain information needed to answer the query?
      - Is the context about the same entities (invoices, vendors, amounts) mentioned in the query?
      
      Return a JSON object:
      {{
        "score": 0.0-1.0,
        "explanation": "Brief explanation of the score"
      }}
    
    evaluate_groundedness: |
      Evaluate if the answer is grounded in (supported by) the provided context.
      
      Context:
      {context}
      
      Answer:
      {answer}
      
      Score the groundedness from 0.0 (not grounded, hallucinated) to 1.0 (fully grounded).
      Consider:
      - Are all facts in the answer present in the context?
      - Does the answer avoid making claims not supported by context?
      
      Return a JSON object:
      {{
        "score": 0.0-1.0,
        "explanation": "Brief explanation of the score"
      }}
    
    evaluate_answer_relevance: |
      Evaluate if the answer is relevant to and addresses the user's query.
      
      Query: {query}
      
      Answer: {answer}
      
      Score the relevance from 0.0 (doesn't address query) to 1.0 (directly answers query).
      Consider:
      - Does the answer address what was asked?
      - Is the answer complete or partial?
      
      Return a JSON object:
      {{
        "score": 0.0-1.0,
        "explanation": "Brief explanation of the score"
      }}
